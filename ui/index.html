<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Resource Brancher</title>
    <link
      rel="icon"
      type="image/png"
      href="assets/resource-brancher-logo.png"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div
      id="loading-screen"
      class="loading-screen"
      role="status"
      aria-live="polite"
    >
      <span class="loading-spinner" aria-hidden="true"></span>
      <span id="loading-message">Loading…</span>
      <button id="retry-loading" class="button subtle" hidden>Retry</button>
    </div>
    <header class="titlebar">
      <div class="appmark pywebview-drag-region">
        <img
          class="brand-logo"
          src="assets/resource-brancher-logo.png"
          alt=""
        /><strong>TINYSPRITE</strong><span class="title-divider"></span
        ><span>Resource Brancher</span>
      </div>
      <div class="window-actions">
        <button data-window="minimize" aria-label="Minimize">−</button
        ><button data-window="maximize" aria-label="Maximize">□</button
        ><button data-window="close" aria-label="Close">×</button>
      </div>
    </header>
    <div class="shell">
      <aside>
        <div class="sidebar-heading">
          <span>Sources</span><span id="library-count" class="count">0</span>
        </div>
        <button class="new-source" data-action="choose_source">
          <span>＋</span> Add source folder
        </button>
        <input
          id="source-search"
          class="source-search"
          type="search"
          placeholder="Search resources…"
          aria-label="Search resources"
        />
        <div id="sources" class="source-list"></div>
        <div class="update-panel">
          <span id="update-status" role="status">Updates</span>
          <button id="update-check" class="button subtle">Check for updates</button>
          <button id="update-download" class="button subtle" hidden>Download update</button>
          <button id="update-install" class="button primary" hidden>Restart with update</button>
        </div>
      </aside>
      <main>
        <nav>
          <button class="tab active" data-tab="workspace">
            Workspace<span id="destination-count" class="count">0</span></button
          ><button class="tab" data-tab="history">
            History<span id="history-count" class="count">0</span>
          </button>
          <button
            class="icon-button"
            id="refresh"
            title="Refresh link status"
            aria-label="Refresh link status"
          ></button>
        </nav>
        <section id="workspace" class="page active">
          <div class="canvas-scroll">
            <div id="branch-map" class="branch-map">
              <div class="source-card">
                <div class="source-icon" id="source-icon"></div>
                <div class="source-description">
                  <h2 id="source-name">Choose a source folder</h2>
                  <p id="source-path" hidden></p>
                </div>
                <select
                  id="source-group"
                  class="source-group"
                  aria-label="Resource group"
                  title="Resource group"
                  disabled
                ></select>
                <button
                  id="open-source"
                  class="icon-button"
                  title="Open source in File Explorer"
                  aria-label="Open source in File Explorer"
                ></button>
                <button id="source-open-with" class="button subtle" disabled>
                  Open with
                </button>
                <button
                  class="button subtle"
                  data-action="choose_source"
                  id="source-choose"
                >
                  Choose folder</button
                ><span class="node-port"></span>
              </div>
              <div class="connection" aria-hidden="true"></div>
              <div id="destination-cards" class="destinations"></div>
            </div>
          </div>
          <div class="workspace-footer">
            <strong id="setup-summary"></strong>
            <button id="create" class="button primary">
              Create branches <span>↗</span>
            </button>
          </div>
        </section>
        <section id="history" class="page">
          <div class="history-toolbar">
            <input
              id="history-search"
              type="search"
              placeholder="Search folders or paths…"
              aria-label="Search history"
            />
          </div>
          <div id="history-list" class="history-list"></div>
        </section>
      </main>
    </div>
    <div id="toast" role="status"></div>
    <div id="editor-menu" class="editor-menu" role="menu" hidden></div>
    <script src="app.js"></script><script src="updates.js"></script>
  </body>
</html>
