name: Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must match VERSION" }
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -p "test_*.py"
      - run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: Resource-Brancher-Windows
          path: dist/*.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME dist/*.zip --verify-tag --generate-notes --title "Resource Brancher $env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
